name: Build YiTapTap APK

on:
  push:
    branches:
      - build/yitaptap-1.0.0
    paths:
      - 'yitaptap-build/source.part*'
      - '.github/workflows/yitaptap-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Build, sign and publish YiTapTap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          WORK=/tmp/yitaptap-repo
          PROJECT=/tmp/yitaptap-project
          LOG=/tmp/yitaptap-build.log
          APK_OUT="$WORK/yitaptap-build/YiTapTap.apk"
          KEYSTORE=/tmp/YiTapTap.jks
          PASS='yitaptap-local-100'
          ALIAS='yitaptap'

          publish_results() {
            local exit_code=$?
            set +e
            if [ -d "$WORK/.git" ]; then
              cd "$WORK"
              rm -f yitaptap-build/output.part* yitaptap-build/signing.part*
              if [ -s "$APK_OUT" ]; then
                base64 -w0 "$APK_OUT" > /tmp/yitaptap-apk.b64
                split -b 45000 -d -a 3 /tmp/yitaptap-apk.b64 yitaptap-build/output.part
                sha256sum "$APK_OUT" > yitaptap-build/YiTapTap.apk.sha256
                file "$APK_OUT" > yitaptap-build/apk-file-type.txt
              fi
              if [ -s "$KEYSTORE" ]; then
                base64 -w0 "$KEYSTORE" > /tmp/yitaptap-key.b64
                split -b 45000 -d -a 3 /tmp/yitaptap-key.b64 yitaptap-build/signing.part
                sha256sum "$KEYSTORE" > yitaptap-build/YiTapTap.jks.sha256
              fi
              {
                echo "exit_code=$exit_code"
                echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "head_ref=$HEAD_REF"
              } > yitaptap-build/build-status.txt
              cp "$LOG" yitaptap-build/build.log 2>/dev/null || true
              rm -f "$APK_OUT"
              git config user.name "YiTapTap Builder"
              git config user.email "actions@github.com"
              git add yitaptap-build/output.part* yitaptap-build/signing.part* yitaptap-build/*.sha256 yitaptap-build/apk-file-type.txt yitaptap-build/build-status.txt yitaptap-build/build.log 2>/dev/null || true
              git commit -m "ci: publish YiTapTap 1.0.0 build" || true
              git push origin "HEAD:$HEAD_REF" || true
            fi
            exit "$exit_code"
          }
          trap publish_results EXIT

          exec > >(tee "$LOG") 2>&1
          rm -rf "$WORK" "$PROJECT"
          git clone --depth 1 --branch "$HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$WORK"
          mkdir -p "$PROJECT"
          cd "$WORK"

          cat yitaptap-build/source.part* | base64 --decode > /tmp/yitaptap-source.tar.xz
          xz --test /tmp/yitaptap-source.tar.xz
          tar -xJf /tmp/yitaptap-source.tar.xz -C "$PROJECT"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

          if command -v gradle >/dev/null 2>&1 && gradle --version | grep -q 'Gradle 8.11.1'; then
            GRADLE=gradle
          else
            curl -L --fail --retry 3 --silent --show-error \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle-8.11.1-bin.zip
            rm -rf /tmp/gradle-8.11.1
            unzip -q /tmp/gradle-8.11.1-bin.zip -d /tmp
            GRADLE=/tmp/gradle-8.11.1/bin/gradle
          fi

          "$GRADLE" -p "$PROJECT" --no-daemon :app:assembleRelease --stacktrace
          UNSIGNED="$PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=YiTapTap,O=New Age Coding Organization,L=Mexico City,C=MX"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" /tmp/YiTapTap-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out "$APK_OUT" \
            /tmp/YiTapTap-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_OUT"
          unzip -t "$APK_OUT"
          test -s "$APK_OUT"
          echo "YiTapTap APK ready: $(wc -c < "$APK_OUT") bytes"
